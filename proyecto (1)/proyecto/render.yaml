services:
  - type: web
    name: prediccion-popularidad-canciones
    runtime: python
    plan: free
    region: oregon
    buildCommand: cd "proyecto (1)/proyecto" && pip install -r requirements.txt
    startCommand: cd "proyecto (1)/proyecto" && uvicorn src.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /salud
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
